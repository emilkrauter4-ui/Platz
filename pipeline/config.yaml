# Passt. – Pipeline-Konfiguration
# Alle Koordinaten in ETRS89 / UTM 32N (EPSG:25832), in Metern.

gebiet:
  name: Sulzbach-Rosenberg Zentrum
  gemeinde_ags: "09371151"
  gemeinde_name: Sulzbach-Rosenberg
  # Aus dem Bauleitplanungsportal Bayern (data/gemeinden.json): für Sulzbach-Rosenberg sind
  # keine Planumringe im Landesportal, nur der Link zur Stadt.
  bauleitplanung_url: https://www.suro.city/leben-in-der-stadt/bauen-und-wohnen/bauleitplanung/
  # 2×2-km-Kachel (entspricht der LoD2-Kachel 698_5486)
  bbox: [698000, 5486000, 700000, 5488000]
  crs: EPSG:25832

pfade:
  raw: ../data/raw
  build: ../data/build
  app_public: ../app/public/data

quellen:
  lod2: https://download1.bayernwolke.de/a/lod2/citygml/{x}_{y}.gml          # 2-km-Kacheln, x/y in km
  dgm1: https://download1.bayernwolke.de/a/dgm/dgm1/{x}_{y}.tif              # 1-km-Kacheln
  dom20: https://download1.bayernwolke.de/a/dom20/DOM/32{x}_{y}_20_DOM.tif   # 1-km-Kacheln
  dop20: https://download1.bayernwolke.de/a/dop20/data/32{x}_{y}.tif         # 1-km-Kacheln
  dop20cir_metalink: https://geoservices.bayern.de/services/poly2metalink/metalink/dop20cir
  hausumringe: https://geodaten.bayern.de/odd/m/3/daten/hausumringe/bezirk/data/093_Oberpfalz_Hausumringe.zip
  laser_metalink: https://geoservices.bayern.de/services/poly2metalink/metalink/laser   # LAZ, 1-km-Kacheln
  tn: https://download1.bayernwolke.de/a/tn/lkr/tn_09371.zip   # ALKIS Tatsächliche Nutzung, Landkreis Amberg-Sulzbach

hoehen:
  # Amtliche Höhen: Normalhöhen DHHN2016. Cesium braucht Ellipsoidhöhen (GRS80).
  # h_ellipsoid = H_normal + N (Quasigeoidundulation GCG2016)
  geoid_grid: de_bkg_gcg2016.tif   # PROJ-Grid (proj-data / cdn.proj.org)
  # Nur falls das Grid nicht erreichbar ist: konstanter Näherungswert für das Gebiet.
  # Wird im Ergebnis als "Annahme" markiert.
  undulation_fallback_m: 47.9

bestand:
  dgm_resample: bilinear
  # CLAUDE.md nennt 0,5 m. Dachüberstände ragen im DOM aber bis ~1 m über die Hausumringe
  # hinaus und erzeugten im Sichtcheck Fehltreffer. Deshalb 1,0 m.
  gebaeude_puffer_m: 1.0
  ndvi_schwelle: 0.25
  hoehe_min_m: 1.8
  hoehe_max_m: 4.5
  oeffnen_px: 2              # morphologisches Öffnen, Strukturelement in Pixeln (20 cm)
  flaeche_min_m2: 3
  flaeche_max_m2: 80
  rechteckigkeit_min: 0.7
  # v1-Filter (Ebenheit, Freistand) sind aus: sie verwarfen alle 20 Referenz-Kleinbauten (Satteldächer
  # sind keine Ebene, Schuppen stehen oft an Hecken). Ersetzt durch Laser-Bestätigung, siehe docs/status.md.
  dach_rauigkeit_max_m: null
  # Ring 1,0–1,6 m um das Objekt: das DOM20 (Bildkorrelation) ist an Kanten ~1 m weit geglättet
  umfeld_ring_innen_px: 5
  umfeld_ring_aussen_px: 8
  umfeld_boden_hoehe_m: 1.0    # darunter gilt ein Pixel als Boden
  umfeld_boden_anteil_min: null # v1: Kleinbauten stehen frei (mind. halber Ring Boden); null = aus
  # v2: zweite Epoche aus Laserdaten (02a_laser.py, Befliegung März 2025, laubfrei)
  laser_band_m: [1.5, 5.0]     # etwas weiter als beim DOM: andere Epoche, andere Glättung
  laser_toleranz_px: 2         # 0,4 m Lagetoleranz zwischen den Epochen
  laser_bestaetigung_min: 0.5  # Anteil der Objektfläche, der auch im Laser-nDSM im Band liegt (null = aus)
  laser_einzelecho_min: 0.5    # Laserzelle zählt nur, wenn ≥ 50 % Einzelechos (Dach statt Strauch); null = aus
  laser_pixelweise: true       # Laser-Bedingung schon vor der Fleckbildung anwenden
  umriss_schrumpfen_m: 0.5     # DOM-Kantenglättung ausgleichen (Pavillon Fröschau 41: 5,5 m statt ~3,5 m)
  anbau_kontakt_max: 0.25      # Flecken, deren Rand zu > 25 % am Gebäudepuffer liegt, sind Dachteile/Anbauten
  # ALKIS Tatsächliche Nutzung: Verkehrsflächen ausmaskieren (geparkte Autos)
  verkehr_maskieren: true
  verkehr_klassen: [Straßenverkehr, Weg, Platz, Bahnverkehr]

terrain:
  # Höhenraster für die App (CustomHeightmapTerrainProvider)
  aufloesung_m: 1.0

# Demo-Adressen (Meilenstein 5). Grenzen mit demo_grenze.py aus der Parzellarkarte abgeleitet und in der App
# als `Demo` gekennzeichnet, nicht als amtliche Flurstücksgrenze. Lokale Meter relativ zur Gebietsmitte.
# Vor einer öffentlichen Demo: Einverständnis der Eigentümer einholen (es sind echte Wohnadressen).
demos:
  - id: grenze
    titel: Gartenhaus an der Grenze
    adresse: Fröschau 41, 92237 Sulzbach-Rosenberg
    objekt: gartenhaus
    start: [347.33, -266.81]   # an der Südwestgrenze, auf der auch der bestehende Pavillon steht
    winkelGrad: -29.1
    grenze: [[369.0, -228.4], [352.4, -250.4], [340.3, -264.9], [357.9, -274.7], [383.0, -250.3], [374.6, -235.5]]
  - id: hang
    titel: Hanglage
    adresse: Am Schützenheim 3, 92237 Sulzbach-Rosenberg
    objekt: gartenhaus
    start: [299.67, 160.65]    # an der talseitigen Südwestgrenze (Gelände 434 → 431 m)
    winkelGrad: -51.5
    hoehe: 2.85                # auf ebenem Boden erlaubt, am Hang über 3 m mittlere Wandhöhe
    grenze: [[315.2, 187.7], [290.5, 169.0], [305.7, 149.9], [326.9, 165.9]]
  - id: waermepumpe
    titel: Wärmepumpe nah am Nachbarn
    adresse: Carl-Orff-Straße 1, 92237 Sulzbach-Rosenberg
    objekt: waermepumpe
    start: [76.8, -916.65]     # Gartenseite an der Hauswand, direkt an der Grenze zur Nachbarhälfte 1a
    winkelGrad: 84
    grenze: [[77.4, -896.6], [74.6, -923.3], [87.6, -925.0], [90.4, -899.4]]

# Mess-Adressen: weitere Gebiete, in denen Objekte mit dem Maßband gemessen werden (docs/vor_ort_anleitung.md).
# Kein Demo, nicht im Pitch-Modus. Aufruf einzelner Schritte mit PASST_GEBIET=<id>, z. B.
#   PASST_GEBIET=scharhof python3 01_buildings.py
# Rohdaten liegen gemeinsam in data/raw (Kachelnamen sind eindeutig); Ausgaben je Gebiet in
# data/build/gebiete/<id> und app/public/data/gebiete/<id>. Modelle, Laserzellen und Embeddings bleiben gemeinsam.
gebiete:
  scharhof:
    name: Scharhof, Hirschau (Mess-Adresse)
    gemeinde_ags: "09371127"            # Stadt Hirschau (OSM de:amtlicher_gemeindeschluessel)
    gemeinde_name: Hirschau
    bauleitplanung_url: null            # noch nicht ermittelt → App zeigt „unbekannt“
    # Kacheln: Scharhof 1 ist in OSM die Industrie-/Betriebsfläche „Gebrüder Dorfner“ (way 51816594, 715227–715920 /
    # 5491161–5492055). Mit 50 m Rand: x 715177–715970, y 5491111–5492105 → 1-km-DOP/DOM/DGM/Laser-Kacheln
    # 715_5491 und 715_5492; LoD2-2-km-Kacheln 714_5490 und 714_5492.
    bbox: [715000, 5491000, 716000, 5493000]
    adresse: Scharhof 1, 92242 Hirschau
    # Lage-Annahme (Label Annahme, vom Nutzer änderbar). Siehe docs/messungen/scharhof_daten.md
    lage:
      bereich: aussen
      grund: >-
        Scharhof 1 ist laut OpenStreetMap das Betriebsgelände Gebrüder Dorfner (Kaolinwerk). Die amtliche Tatsächliche
        Nutzung (ALKIS) weist dort Tagebau und Industrie-/Gewerbefläche aus, die nächste Wohnbaufläche liegt rund
        650 m entfernt. Das ist kein Teil des zusammenhängend bebauten Ortes Hirschau, daher vermutlich Außenbereich
        (§ 35 BauGB). Ob ein Bebauungsplan gilt, ist offen. Nicht amtlich geprüft.
    # Kartenausschnitt, auf den die App bei „Mess-Adresse wählen“ zoomt (UTM)
    start: [715420, 5491910]

